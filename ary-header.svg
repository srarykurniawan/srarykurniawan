<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ary Kurniawan — Data Engineer, Data Analyst, Business Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1F33"/>
      <stop offset="1" stop-color="#0B2B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94A3B8" opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .b { transform-box: fill-box; transform-origin: bottom; animation: grow 3.2s ease-in-out infinite alternate; }
      .b2 { animation-delay: .3s } .b3 { animation-delay: .6s } .b4 { animation-delay: .9s } .b5 { animation-delay: 1.2s }
      @keyframes grow { from { transform: scaleY(.72); } to { transform: scaleY(1); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .p2 { animation-delay: .6s } .p3 { animation-delay: 1.2s }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .flow, .b, .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <ellipse cx="600" cy="150" rx="460" ry="190" fill="url(#glow)"/>

    <!-- Left: bar chart + trend line -->
    <g transform="translate(70 80)">
      <line x1="0" y1="150" x2="190" y2="150" stroke="#475569" stroke-width="1.5"/>
      <rect class="b"    x="8"   y="96"  width="24" height="54"  rx="4" fill="url(#bar)"/>
      <rect class="b b2" x="44"  y="70"  width="24" height="80"  rx="4" fill="url(#bar)"/>
      <rect class="b b3" x="80"  y="84"  width="24" height="66"  rx="4" fill="url(#bar)"/>
      <rect class="b b4" x="116" y="44"  width="24" height="106" rx="4" fill="url(#bar)"/>
      <rect class="b b5" x="152" y="18"  width="24" height="132" rx="4" fill="url(#bar)"/>
      <polyline points="20,78 56,52 92,64 128,26 164,0" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#0B1220" stroke="#38BDF8" stroke-width="2.5">
        <circle cx="20" cy="78" r="4"/><circle cx="56" cy="52" r="4"/><circle cx="92" cy="64" r="4"/><circle cx="128" cy="26" r="4"/><circle cx="164" cy="0" r="4"/>
      </g>
    </g>

    <!-- Right: pipeline (source -> transform -> warehouse) -->
    <g transform="translate(950 62)" fill="none" stroke-linecap="round">
      <path class="flow" d="M34 44 V78" stroke="#2DD4BF" stroke-width="2.5"/>
      <path class="flow" d="M154 44 V78" stroke="#2DD4BF" stroke-width="2.5"/>
      <path class="flow" d="M34 78 H154" stroke="#2DD4BF" stroke-width="2.5"/>
      <path class="flow" d="M94 78 V112" stroke="#2DD4BF" stroke-width="2.5"/>
      <path class="flow" d="M94 150 V172" stroke="#2DD4BF" stroke-width="2.5"/>

      <!-- sources -->
      <g class="pulse" stroke="#2DD4BF" stroke-width="2.5" fill="#0F1F33">
        <rect x="10" y="4" width="48" height="40" rx="8"/>
      </g>
      <g stroke="#2DD4BF" stroke-width="2"><path d="M20 17 H48 M20 25 H48 M20 33 H38"/></g>
      <g class="pulse p2" stroke="#2DD4BF" stroke-width="2.5" fill="#0F1F33">
        <rect x="130" y="4" width="48" height="40" rx="8"/>
      </g>
      <g stroke="#2DD4BF" stroke-width="2"><path d="M141 34 V24 M151 34 V16 M161 34 V21 M171 34 V12" /></g>

      <!-- transform gear-ish node -->
      <g class="pulse p3" stroke="#38BDF8" stroke-width="2.5" fill="#0F1F33">
        <rect x="66" y="112" width="56" height="38" rx="19"/>
      </g>
      <path d="M82 131 H106 M100 125 L106 131 L100 137" stroke="#38BDF8" stroke-width="2.2" stroke-linejoin="round"/>

      <!-- warehouse cylinder -->
      <g stroke="#2DD4BF" stroke-width="2.5" fill="#0F1F33">
        <path d="M66 180 V206 A28 9 0 0 0 122 206 V180"/>
        <ellipse cx="94" cy="180" rx="28" ry="9"/>
      </g>
      <path d="M66 193 A28 9 0 0 0 122 193" stroke="#2DD4BF" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- Center text -->
    <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="600" y="98" font-size="20" fill="#94A3B8" letter-spacing="6">HELLO, I AM</text>
      <text x="600" y="168" font-size="68" font-weight="700" fill="#F8FAFC" letter-spacing="1">Ary Kurniawan</text>
      <rect x="520" y="188" width="160" height="4" rx="2" fill="url(#accent)"/>
      <text x="600" y="232" font-size="18" fill="#5EEAD4" letter-spacing="1.5" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">Data Engineer  |  Data Analyst  |  Business Intelligence</text>
    </g>

    <rect x="1.5" y="1.5" width="1197" height="297" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="3"/>
  </g>
</svg>
